[package]
name = "terra-wm"
version = "0.1.0"
edition = "2024"

[dependencies]
bitflags = "2"
smithay = { version = "0.7.0", default-features = false, features = ["backend_winit", "desktop", "renderer_gl", "wayland_frontend"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
wayland-client = "0.31"
wayland-protocols = "0.32"

[[example]]
name = "test_client"
